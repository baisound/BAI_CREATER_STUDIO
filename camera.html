<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAI Camera | BAI Creator Studio</title><link rel="stylesheet" href="/camera.css"></head><body>
<header><a href="/">← BAI Creator Studio</a><strong>BAI Camera</strong><span>シネマティックカメラ・キーフレーム基礎</span><button id="save">保存</button><button id="undo">戻す</button><button id="redo">やり直す</button></header>
<main><section class="view"><div class="preview-shell"><canvas id="preview" aria-label="ワイヤーフレーム式カメラ構図プレビュー"></canvas><div class="camera-frame" aria-hidden="true"></div><span class="camera-frame-label">撮影フレーム 16:9（構図ガイド）</span></div><div class="transport"><button id="play">▶ 再生</button><button id="prev">◀ 1フレーム</button><input id="frame" type="range" min="0" max="300" value="0"><button id="next">1フレーム ▶</button><label class="inline-control">現在フレーム<input id="frame-number" type="number" min="0" max="1000000" value="0" step="1"></label><output id="frame-label">0 / 300</output></div><section class="timeline"><h3>カメラキーフレーム <small>◆を選択して編集・ドラッグ移動</small></h3><div class="timeline-settings"><label>総フレーム数<input id="duration" type="number" min="1" max="1000000" step="1" value="300"></label><button id="duration-apply">尺を変更</button><label>表示開始<input id="range-start" type="number" min="0" step="1" value="0"></label><label>表示幅<input id="range-size" type="number" min="2" step="1" value="300"></label><button id="range-apply">表示範囲を適用</button><button id="range-prev">◀ 範囲移動</button><button id="range-next">範囲移動 ▶</button></div><div id="track" tabindex="0"></div><p id="range-label" class="hint"></p><button id="add">＋ 現在位置にキー追加</button><button id="remove">選択キーを削除</button></section></section>
<aside><h2>カメラ操作</h2><p>キーフレームごとに補間方式を選択できます。現在は撮影用の簡易人体ガイドです（実モデルは未接続）。プレビューを左ドラッグ：周回／Shift＋ドラッグ：パン／ホイール：ドリー。カメラ操作はキーとして登録されます。</p><label>ショット<select id="preset"><option value="front">正面</option><option value="close">顔アップ（汎用ターゲット）</option><option value="side">横から</option><option value="overhead">俯瞰</option><option value="orbit">周回位置</option></select></label><button id="preset-apply">現在フレームに適用</button><fieldset><legend>カメラ移動（現在フレームにキー登録）</legend><label>操作量（周回・ティルト＝度、移動＝シーン単位） <input id="move-amount" type="number" value="15" step="1" min="-360" max="360"></label><div class="actions"><button type="button" data-camera-move="orbit">周回</button><button type="button" data-camera-move="dolly">ドリー</button><button type="button" data-camera-move="pan">パン</button><button type="button" data-camera-move="tilt">ティルト</button></div></fieldset><fieldset><legend>カメラ位置 (XYZ)</legend><div id="position-fields"></div></fieldset><fieldset><legend>注視点 (XYZ)</legend><div id="target-fields"></div></fieldset><label>このキーから次のキーへの補間 <select id="interpolation"><option value="linear">線形</option><option value="smooth">滑らか（Smoothstep）</option><option value="hold">保持（ステップ）</option></select></label><label>視野角 FOV <input id="fov" type="number" min="5" max="150" step="1"></label><div class="actions"><button id="key-save">現在フレームをキー化</button><button id="copy">プロジェクトJSONを書き出す</button></div><p id="status" role="status" aria-live="polite">読み込み中</p><details><summary>現在の補間値（JSON）</summary><pre id="sample"></pre></details></aside></main><script src="/camera.js" defer></script></body></html>
