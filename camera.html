<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAI Camera | BAI Creator Studio</title><link rel="stylesheet" href="/camera.css"></head><body>
<header><a href="/">← BAI Creator Studio</a><strong>BAI Camera</strong><span>シネマティックカメラ・キーフレーム基礎</span><button id="save">保存</button><button id="undo">戻す</button><button id="redo">やり直す</button></header>
<main><section class="view"><canvas id="preview" aria-label="ワイヤーフレーム式カメラ構図プレビュー"></canvas><div class="transport"><button id="play">▶ 再生</button><button id="prev">◀ 1フレーム</button><input id="frame" type="range" min="0" max="300" value="0"><button id="next">1フレーム ▶</button><output id="frame-label">0 / 300</output></div><section class="timeline"><h3>カメラキーフレーム <small>◆を選択して編集・ドラッグ移動</small></h3><div id="track" tabindex="0"></div><button id="add">＋ 現在位置にキー追加</button><button id="remove">選択キーを削除</button></section></section>
<aside><h2>カメラ操作</h2><p>キーフレーム間は線形補間。3Dモデルはまだ表示しない構図確認用プレビューです。</p><label>ショット<select id="preset"><option value="front">正面</option><option value="close">顔アップ（汎用ターゲット）</option><option value="side">横から</option><option value="overhead">俯瞰</option><option value="orbit">周回位置</option></select></label><button id="preset-apply">現在フレームに適用</button><fieldset><legend>カメラ位置 (XYZ)</legend><div id="position-fields"></div></fieldset><fieldset><legend>注視点 (XYZ)</legend><div id="target-fields"></div></fieldset><label>視野角 FOV <input id="fov" type="number" min="5" max="150" step="1"></label><div class="actions"><button id="key-save">現在フレームをキー化</button><button id="copy">プロジェクトJSONを書き出す</button></div><p id="status" role="status" aria-live="polite">読み込み中</p><details><summary>現在の補間値（JSON）</summary><pre id="sample"></pre></details></aside></main><script src="/camera.js" defer></script></body></html>
