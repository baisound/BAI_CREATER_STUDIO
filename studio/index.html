<!doctype html>
<html lang="ja" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAI Creator Studio — 新UI（操作モック）</title>
<link rel="stylesheet" href="/studio/styles/tokens.css">
<link rel="stylesheet" href="/studio/styles/app.css">
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<div class="app" id="app">
  <header class="topbar" role="banner">
    <button class="icon-btn only-narrow" id="nav-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="sidebar">☰</button>
    <a class="brand" href="/workspace/01" data-route="01"><span class="brand-mark">BAI</span> Creator Studio</a>
    <div class="history-btns">
      <button class="icon-btn" id="nav-back" type="button" title="戻る (Alt+←)" aria-label="戻る">‹</button>
      <button class="icon-btn" id="nav-forward" type="button" title="進む (Alt+→)" aria-label="進む">›</button>
    </div>
    <nav class="breadcrumb" aria-label="現在位置" id="breadcrumb"></nav>
    <div class="topbar-right">
      <button class="search-btn" id="palette-open" type="button" title="画面を検索して移動 (Ctrl+K)">画面を検索 <kbd>Ctrl K</kbd></button>
      <span class="mock-chip" title="この新UIは操作モックです。実データへの接続は「実機能」表示の箇所だけです。">UIモック P1</span>
      <a class="text-link" href="/" title="現行の制作画面（既存機能）を開きます">現行画面 ↗</a>
    </div>
  </header>
  <aside class="sidebar" id="sidebar" aria-label="ワークスペース">
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="legend" aria-label="表示の凡例">
        <span class="badge badge-real">実機能</span>
        <span class="badge badge-partial">既存・部分</span>
        <span class="badge badge-mock">サンプル表示</span>
        <span class="badge badge-unimpl">◇ 未実装</span>
      </div>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="toast-host" id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<script type="module" src="/studio/js/app.js"></script>
</body>
</html>
